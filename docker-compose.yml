services:
  db:
    # Matches the Railway timescale-postgis template's major version, so local
    # and hosted behave the same. Bare -ha tags already bundle PostGIS; the
    # -all suffix means extra *PostgreSQL* majors for pg_upgrade, not extras.
    image: timescale/timescaledb-ha:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: teltonika
      POSTGRES_USER: teltonika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Bound to loopback: the database is reachable from the listener over the
    # compose network and from an SSH tunnel, never from the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teltonika -d teltonika"]
      interval: 10s
      timeout: 5s
      retries: 10

  listener:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://teltonika:${POSTGRES_PASSWORD}@db:5432/teltonika
      TELTONIKA_LOG_DIR: /var/log/teltonika
      # Comma separated. Without it the listener accepts any device.
      TELTONIKA_ALLOWED_IMEIS: ${TELTONIKA_ALLOWED_IMEIS:-}
    # The only port open to the world. Devices dial in here.
    ports:
      - "5027:5027"
    volumes:
      - ./logs:/var/log/teltonika
      # To enable the IMEI allowlist: create allowed_imeis.txt next to this
      # file, uncomment the mount, and add
      #   --allowlist /opt/teltonika/allowed_imeis.txt
      # to the container command. The file is gitignored, so it will not exist
      # on a fresh clone -- and a missing bind-mount source makes Docker create
      # a *directory* in its place, which fails confusingly.
      # - ./allowed_imeis.txt:/opt/teltonika/allowed_imeis.txt:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://teltonika:${POSTGRES_PASSWORD}@db:5432/teltonika
      API_KEY: ${API_KEY:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
    # Loopback only: put a TLS reverse proxy (Dokploy's Traefik, Caddy) in
    # front rather than exposing plain HTTP with fleet positions on it. See
    # docs/api.md.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
